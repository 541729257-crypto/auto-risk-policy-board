<main><section class="intro"><div><p class="eyebrow">RISK POLICY DASHBOARD</p><h1>风险政策一页纸</h1><p class="subtitle">快速定位适用政策，清晰查阅业务要求。</p></div><div class="source">数据来源<span>风险政策总表 · 更新于 2026.10.12</span></div></section>

<section class="workspace"><aside><div class="list-heading"><h2>匹配结果</h2><span id="count" aria-live="polite"></span></div><p class="hint">选择政策查看完整要求</p><div id="results"></div></aside><article id="detail" aria-live="polite"></article></section>
<footer>来源：风险政策一页纸数据源20260929.xlsx<span>按原始表格展示 · 空白单元格显示为「未填写」</span></footer></main><script>const filterKeys=['适用品牌','金融类型','业务场景'];
let records=[],selected=null,query='';const state=Object.fromEntries(filterKeys.map(k=>[k,'']));
const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const value=v=>escapeHTML(v||'未填写');
const normalize=v=>String(v??'').normalize('NFKC').toLocaleLowerCase().replace(/\s+/g,'');
function searchMatches(row){const haystack=normalize(Object.values(row).join(' '));return query.trim().split(/\s+/).filter(Boolean).every(term=>haystack.includes(normalize(term)));}
function matches(row,except){return filterKeys.every(k=>k===except||!state[k]||row[k]===state[k]);}
function renderFilters(){document.querySelector('#filters').innerHTML=filterKeys.map((key,i)=>{const options=[...new Set(records.filter(r=>matches(r,key)).map(r=>r[key]))].sort((a,b)=>a.localeCompare(b,'zh-CN'));if(state[key]&&!options.includes(state[key]))options.unshift(state[key]);return `<div><label for="filter-${i}">${key}</label><select id="filter-${i}" data-key="${key}"><option value="">全部${key}</option>${options.map(v=>`<option value="${escapeHTML(v)}" ${state[key]===v?'selected':''}>${escapeHTML(v||'未填写')}</option>`).join('')}</select></div>`}).join('');document.querySelectorAll('select').forEach(el=>el.addEventListener('change',()=>{state[el.dataset.key]=el.value;selected=null;render();}));}

document.querySelector('#reset').addEventListener('click',()=>{filterKeys.forEach(k=>state[k]='');query='';document.querySelector('#search').value='';selected=null;render();});
